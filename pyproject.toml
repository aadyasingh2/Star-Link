[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sapr-simulator"
version = "0.1.0"
description = "Stability-Aware Predictive Routing for LEO Satellite Constellations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "skyfield",
    "networkx",
    "numpy",
    "pandas",
    "matplotlib",
    "simpy",
    "pytest",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: real-constellation tests"]
