constellation:
  planes: 24
  sats_per_plane: 22
  phasing: 1
  altitude_km: 550
  inclination_deg: 53
  isl_max_range_km: 3000
  minimum_elevation_deg: 25
  isl_inter_plane_max_lat_deg: 45

simulation:
  timestep_s: 1.0
  duration_s: 3600.0
  random_seed: 42

network:
  isl_rate_gbps: 10
  ground_link_rate_gbps: 1
  queue_size_packets: 1000

ground_stations:
  - name: "Chennai"
    lat: 13.0827
    lon: 80.2707
  - name: "London"
    lat: 51.5074
    lon: -0.1278
  - name: "New York"
    lat: 40.7128
    lon: -74.0060
  - name: "Tokyo"
    lat: 35.6762
    lon: 139.6503
  - name: "Sydney"
    lat: -33.8688
    lon: 151.2093

sapr:
  look_ahead_window_s: 300
  alpha: 0.5
  guard_time_s: 5.0
  hysteresis_margin_ms: 10.0
  latency_bound_multiplier: 1.2

routing:
  boot_window_s: 60.0                 # seconds
  detection_delay_s: 0.1
  lsa_processing_delay_ms: 1.0       # ms – per-hop processing delay for LSA messages
  dv_processing_delay_ms: 1.0        # ms – per-hop processing delay for DV updates
  spf_holddown_s: 1.0
  dv_update_interval_s: 30.0
  dv_triggered_holdoff_s: 1.0  # seconds
  dv_infinity: 10000.0               # ms
  dv_poison_reverse: true
  cost_change_threshold_ms: 2.0
  zero_delay: false                   # when true, propagation AND processing delays are 0
  bytes_per_lsa_header: 24
  bytes_per_lsa_link: 8
  bytes_per_dv_header: 24
  bytes_per_dv_entry: 8
